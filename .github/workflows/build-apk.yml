name: Compilar APK com Gradle do Servidor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar o Gradle
      uses: gradle/actions/setup-gradle@v3
      # Esse action do Gradle instala automaticamente a versão correta do Gradle se ela não estiver presente

    - name: Compilar o APK (Debug)
      run: gradle assembleDebug
      # Nota: usamos apenas 'gradle' em vez de './gradlew'

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
